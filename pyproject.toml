[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asri-research"
version = "0.0.1"
description = "Experimental infrastructure for Adaptive Sparse Recurrent Intelligence"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "huggingface-hub>=0.30",
  "psutil>=5.9",
  "torch>=2.3",
  "transformers>=4.51.0",
]

[project.optional-dependencies]
eval = [
  "datasets>=3",
  "numpy>=1.26",
  "evalplus>=0.3",
  "absl-py>=1.4",
  "langdetect>=1.0.9",
  "immutabledict>=2",
  "nltk>=3.8",
]
dev = [
  "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
